# OWASP CRS Plugin Descriptor
# See https://github.com/coreruleset/plugin-registry for the schema definition.

schema_version: 1

plugin:
  name: "ghost-rule-exclusions-plugin"
  description: "Rule exclusions plugin for ghost."
  long_description: |
    Provides targeted rule exclusions to eliminate false positive when running
    OWASP CRS in front of Ghost, a federated blogging software.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
    - name: "JesseBot"
      url: "https://jessebot.work"
  repository: "https://github.com/jessebot/ghost-rule-exclusions-plugin"
  keywords:
    - "ghost"
    - "rule-exclusions"
    - "blog"
    - "false-positive"

rule_id_range:
  start: 9518000
  end: 9518999

compatibility:
  crs_version: ">=4.0.0"
  # engines is spelled out here, even though the ghost-rule-exclusions supports all three,
  # to showcase the field for authors copying this file. A real plugin that
  # truly supports every engine should omit `engines` instead: per
  # docs/plugin-descriptor-schema.md, an omitted field already means "all".
  engines:
    - "modsecurity3"
    - "coraza"

configuration:
  file: "plugins/ghost-rule-exclusions-config.conf"
  variables:
    - name: "tx.ghost-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enables or disables the ghost-rule-exclusions plugin (0 to disable)."
      required: false
