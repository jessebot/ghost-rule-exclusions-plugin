# OWASP CRS Plugin
# Plugin name: ghost-exclusions-plugin
# Plugin description: Ghost Exlcuisons plugin. This is to allow legimate traffic to ghost blogs.
# Rule ID block base: 9,518,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:template-plugin_enabled "@eq 0" "id:9500099,phase:1,pass,nolog,ctl:ruleRemoveById=9500100-9500999"

# rule 9,500,100 : Detect ARGS template-plugin-test-parameter and trigger alert if hit
SecRule ARGS:template-plugin-test-parameter "@rx ." \
	"id:9500100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter template-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'template-plugin',\
        ver:'template-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# allowing email 2FA codes for ghost admin users
# Fixes 911100 being triggered
SecRule REQUEST_URI "@rx ^/ghost/api/admin/session/verify/$" \
        "id:9518000,\
        phase:1,\
        pass,
        log,
        ver:'ghost-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=PUT GET'"

# allowing ghost admin users to logout
# Fixes 911100 being triggered
SecRule REQUEST_URI "@rx ^/ghost/api/admin/session$" \
        "id:9518001,
        phase:1,
        pass,
        log,
        ver:'ghost-exclusions-plugin/1.0.0',
        setvar:'tx.allowed_methods=DELETE'"

SecRule REQUEST_URI "@rx ^/ghost/api/admin/session/$" \
        "id:9518002,
        phase:1,
        pass,
        log,
        ver:'ghost-exclusions-plugin/1.0.0',
        setvar:'tx.allowed_methods=DELETE'"

# allow ghost users (non-admins) to logout
# Fixes 911100 being triggered
SecRule REQUEST_URI "@rx ^/members/api/session/$" \
        "id:9518003,
        phase:1,
        pass,
        log,
        ver:'ghost-exclusions-plugin/1.0.0',
        setvar:'tx.allowed_methods=DELETE'"

# this allows users to communicate with ghost blogs via the fediverse
SecRule REQUEST_URI "@rx ^/.ghost/activitypub/inbox/index$" \
        "id:9518004,
        phase:1,
        pass,
        log,
        ver:'ghost-exclusions-plugin/1.0.0',
        setvar:'tx.allowed_request_content_type=|application/activity+json|'"
