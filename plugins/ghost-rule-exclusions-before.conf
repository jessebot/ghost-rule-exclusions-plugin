# OWASP CRS Plugin
# Plugin name: ghost-rule-exclusions-plugin
# Plugin description: Ghost Exlcuisons plugin. This is to allow legimate traffic to ghost blogs.
# Rule ID block base: 9,518,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:ghost-rule-exclusions-plugin_enabled "@eq 0" \
        "id:9518099,\
        phase:1,\
        pass,\
        nolog,\
        ctl:ruleRemoveById=9518000-9518999"

# rule 9,518,100 : Detect ARGS ghost-exlcuisons-plugin-test-parameter and trigger alert if hit
SecRule ARGS:ghost-rule-exclusions-plugin-test-parameter "@rx ." \
	"id:9518100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter ghost-rule-exclusions-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'ghost-rule-exclusions-plugin',\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# [ Local CRS initialization ]
#
# We need to initialize some of the CRS variables also here because plugin setup runs before
# CRS initialization (this is a known limitation of the current plugin architecture). Must be
# kept in sync with CRS default setting.

# Copy of CRS rule 901160.
SecRule &TX:allowed_methods "@eq 0" \
    "id:9518101,\
    phase:1,\
    pass,\
    nolog,\
    ver:'ghost-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"


# Copy of CRS rule 901162.
SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:9518102,\
    phase:1,\
    pass,\
    nolog,\
    ver:'ghost-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|'"

# ------------------------------------------------------------------------
# allowing email 2FA codes for ghost admin users
# Fixes 911100 being triggered
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /ghost/api/admin/session/verify/" \
        "id:9518000,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT'"

# ------------------------------------------------------------------------
# allowing ghost admin users to logout
# Fixes 911100 being triggered
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /ghost/api/admin/session" \
        "id:9518001,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

SecRule REQUEST_URI "@endsWith /ghost/api/admin/session/" \
        "id:9518002,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

# ------------------------------------------------------------------------
# allow ghost users (non-admins) to logout
# Fixes 911100 being triggered
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /members/api/session/" \
        "id:9518003,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

# ------------------------------------------------------------------------
# this allows users to communicate with ghost blogs via the fediverse
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /.ghost/activitypub/inbox/index" \
        "id:9518004,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        chain"
        SecRule REQUEST_METHOD "@pm PUT GET" \
                "t:none,\
                ctl:requestBodyProcessor=JSON,\
                setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/activity+json|'"

# ------------------------------------------------------------------------
# allow users to Get and Delete their posts
#
# when the user does a PUT to create or update their post URI will look like:
# /ghost/api/admin/posts/xxxxxx0xxxxxxx0xxxxxxxxx/?formats=mobiledoc%2Clexical&include=tags%2Cauthors%2Cauthors.roles%2Cemail%2Ctiers%2Cnewsletter%2Ccount.clicks%2Cpost_revisions%2Cpost_revisions.author
# not sure how to regex that perfectly
#
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@contains /ghost/api/admin/posts/" \
        "id:9518005,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE PUT'"

# ------------------------------------------------------------------------
# This also Allows a user to edit a blog post with image captions,
# including for "feature image" of the blog post
#
# URI will be something like this:
# "/ghost/api/admin/posts/6afb70682570f00001ee493c/"
# With the query looking like this:
# ?formats=mobiledoc%2Clexical&save_revision=true&include=tags%2Cauthors%2Cauthors.roles%2Cemail%2Ctiers%2Cnewsletter%2Ccount.clicks%2Cpost_revisions%2Cpost_revisions.author"
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@contains /ghost/api/admin/posts/" \
        "id:9518006,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        chain"
        SecRule REQUEST_METHOD "@streq PUT" \
            "t:none,\
            ctl:ruleRemoveTargetById=941100;ARGS:json.posts.0.feature_image_caption,\
            ctl:ruleRemoveTargetById=941160;ARGS:json.posts.0.feature_image_caption,\
            ctl:ruleRemoveTargetById=941100;ARGS:json.posts.0.lexical,\
            ctl:ruleRemoveTargetById=941160;ARGS:json.posts.0.lexical"

# ------------------------------------------------------------------------
# allow users to change their passwords
# allows 911100: Method is not allowed by policy: PUT
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /ghost/api/admin/users/password/" \
        "id:9518007,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT'"

# ------------------------------------------------------------------------
# Allows users to change any field when they edit their user profile.
# allows:
#   - 911100: Method is not allowed by policy : PUT
#   - 930120: OS File Access Attempt
#
# Matched Zones: ARGS_NAMES.json.users.0.profile_image
# Matched Data:  .profile found within ARGS_NAMES:json.users.0.profile_image
# example uri:   /ghost/api/admin/users/6afa0a8c2570f00001ee4934/?include=roles
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /ghost/api/admin/users/[a-zA-Z0-9_\-]+/\?include=roles" \
        "id:9518008,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        chain"
        SecRule REQUEST_URI "@endsWith roles" \
            "t:none,\
            setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT',\
            ctl:ruleRemoveTargetById=941160;ARGS:json.users.0.profile_image,\
            ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.users.0.profile_image"

# ------------------------------------------------------------------------
# Allows admins to change access their admin admin_toolbar in their dashboard
# allows:
#   - 920420: Request content type is not allowed by policy
# uri would be: /?admin_toolbar=0
# ------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /?admin_toolbar=0" \
        "id:9518009,\
        phase:1,\
        pass,\
        nolog,\
        ver:'ghost-rule-exclusions-plugin/1.0.0',\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |text/html|'"

