---
meta:
  author: "Jesse Hitch"
  description: "Ghost Rule Exclusions Plugin allowing sessions to deleted"
rule_id: 9518001
tests:
  - test_id: 1
    desc: Check if users can delete a session
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: DELETE
          uri: /ghost/api/admin/session
          data: |
            text
        output:
          log:
            no_expect_ids: [911100]
