---
meta:
  author: "Jesse Hitch"
  description: "Ghost Rule Exclusions Plugin allowing admin toolbar to accessed"
rule_id: 9518009
tests:
  - test_id: 1
    desc: Check if users can access their admin toolbar
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: text/html
          port: 80
          method: GET
          uri: /?admin_toolbar=0
          data: |
            text
        output:
          log:
            no_expect_ids: [920420]
