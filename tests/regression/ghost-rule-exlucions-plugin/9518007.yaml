---
meta:
  author: "Jesse Hitch"
  description: "Ghost Rule Exclusions Plugin allowing passwords to be updated"
rule_id: 9518007
tests:
  - test_id: 1
    desc: Check if users can update a password
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: /ghost/api/admin/users/password/
          data: |
            text
        output:
          log:
            no_expect_ids: [911100]
