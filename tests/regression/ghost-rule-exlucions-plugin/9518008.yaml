---
meta:
  author: "Jesse Hitch"
  description: "Ghost Rule Exclusions Plugin allowing users to edit their profile"
rule_id: 9518008
tests:
  - test_id: 1
    desc: Check if users can edit their profile
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          port: 80
          method: PUT
          uri: /ghost/api/admin/users/6afa0a8c2570f00001ee4934/?include=roles
          data: |-
            {"users":[{"profile_image":"test"}]}
        output:
          log:
            no_expect_ids:
              - 911100
              - 930120
              - 941160
