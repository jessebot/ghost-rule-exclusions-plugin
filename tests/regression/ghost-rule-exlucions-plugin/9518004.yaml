---
meta:
  author: "Jesse Hitch"
  description: "Ghost Rule Exclusions Plugin federation check"
rule_id: 9518004
tests:
  - test_id: 1
    desc: Check if ghost blog can federate properly with cocrrect content type
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/activity+json
          port: 80
          method: GET
          uri: /.ghost/activitypub/inbox/index
          data: |-
            {"@context":["https://www.w3.org/ns/activitystreams","https://w3id.org/security/v1"],"id":"https://mastodon.example.tld/users/exampleUser#delete","type":"Delete","actor":"https://mastodon.example.tld/users/exampleUser","to":["https://www.w3.org/ns/activitystreams#Public"],"object":"https://mastodon.example.tld/users/exampleUser","signature":{"type":"RsaSignature2017","creator":"https://mastodon.example.tld/users/exampleUser#main-key","created":"2026-11-19T15:37:39Z","expires":"2026-11-21T15:37:39Z","signatureValue":""}}
        output:
          log:
            no_expect_ids: [920420]
